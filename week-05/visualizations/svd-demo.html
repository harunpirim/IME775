<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVD & Low-Rank Approximation - IME 775</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen py-8">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;

        function SVDVisualization() {
            // 3x3 matrix entries
            const [matrix, setMatrix] = useState([
                [3, 1, 1],
                [1, 3, 1],
                [1, 1, 3]
            ]);
            const [rank, setRank] = useState(3);

            const updateMatrix = (i, j, val) => {
                const newMatrix = matrix.map(row => [...row]);
                newMatrix[i][j] = parseFloat(val) || 0;
                setMatrix(newMatrix);
            };

            // Simple SVD computation for 3x3 (using power iteration approximation)
            const { U, S, V, approx, error, energyCapture } = useMemo(() => {
                const A = matrix;
                const m = 3, n = 3;

                // Compute A^T A
                const AtA = Array(n).fill(0).map(() => Array(n).fill(0));
                for (let i = 0; i < n; i++) {
                    for (let j = 0; j < n; j++) {
                        for (let k = 0; k < m; k++) {
                            AtA[i][j] += A[k][i] * A[k][j];
                        }
                    }
                }

                // Power iteration to find eigenvalues/vectors of AtA
                const eigenPairs = [];
                let remaining = AtA.map(row => [...row]);

                for (let iter = 0; iter < 3; iter++) {
                    // Power iteration
                    let v = [1, 1, 1];
                    for (let p = 0; p < 50; p++) {
                        let newV = [0, 0, 0];
                        for (let i = 0; i < 3; i++) {
                            for (let j = 0; j < 3; j++) {
                                newV[i] += remaining[i][j] * v[j];
                            }
                        }
                        const norm = Math.sqrt(newV.reduce((s, x) => s + x * x, 0));
                        v = newV.map(x => x / (norm || 1));
                    }

                    // Eigenvalue
                    let Av = [0, 0, 0];
                    for (let i = 0; i < 3; i++) {
                        for (let j = 0; j < 3; j++) {
                            Av[i] += remaining[i][j] * v[j];
                        }
                    }
                    const lambda = v.reduce((s, x, i) => s + x * Av[i], 0);

                    eigenPairs.push({ lambda: Math.max(0, lambda), v });

                    // Deflate
                    for (let i = 0; i < 3; i++) {
                        for (let j = 0; j < 3; j++) {
                            remaining[i][j] -= lambda * v[i] * v[j];
                        }
                    }
                }

                // Sort by eigenvalue
                eigenPairs.sort((a, b) => b.lambda - a.lambda);

                const singularValues = eigenPairs.map(p => Math.sqrt(Math.max(0, p.lambda)));
                const V_mat = eigenPairs.map(p => p.v);

                // Compute U = AV / sigma
                const U_mat = V_mat.map((v, idx) => {
                    const sigma = singularValues[idx];
                    if (sigma < 0.0001) return [0, 0, 0];
                    const u = [0, 0, 0];
                    for (let i = 0; i < 3; i++) {
                        for (let j = 0; j < 3; j++) {
                            u[i] += A[i][j] * v[j];
                        }
                    }
                    return u.map(x => x / sigma);
                });

                // Low-rank approximation
                const approxMatrix = Array(3).fill(0).map(() => Array(3).fill(0));
                for (let r = 0; r < rank; r++) {
                    const sigma = singularValues[r];
                    const u = U_mat[r];
                    const v = V_mat[r];
                    for (let i = 0; i < 3; i++) {
                        for (let j = 0; j < 3; j++) {
                            approxMatrix[i][j] += sigma * u[i] * v[j];
                        }
                    }
                }

                // Compute error
                let errSum = 0;
                for (let i = 0; i < 3; i++) {
                    for (let j = 0; j < 3; j++) {
                        errSum += Math.pow(A[i][j] - approxMatrix[i][j], 2);
                    }
                }
                const frobError = Math.sqrt(errSum);

                // Energy captured
                const totalEnergy = singularValues.reduce((s, x) => s + x * x, 0);
                const capturedEnergy = singularValues.slice(0, rank).reduce((s, x) => s + x * x, 0);
                const energyPct = totalEnergy > 0 ? (capturedEnergy / totalEnergy) * 100 : 100;

                return {
                    U: U_mat,
                    S: singularValues,
                    V: V_mat,
                    approx: approxMatrix,
                    error: frobError,
                    energyCapture: energyPct
                };
            }, [matrix, rank]);

            const MatrixDisplay = ({ data, label, highlight = false }) => (
                <div className="text-center">
                    <p className="text-sm font-medium text-gray-600 mb-1">{label}</p>
                    <div className={`inline-block border-l-2 border-r-2 border-gray-600 px-2 py-1 ${highlight ? 'bg-yellow-50' : 'bg-white'}`}>
                        {data.map((row, i) => (
                            <div key={i} className="flex gap-2">
                                {row.map((val, j) => (
                                    <span key={j} className="w-12 text-right font-mono text-sm">
                                        {typeof val === 'number' ? val.toFixed(2) : val}
                                    </span>
                                ))}
                            </div>
                        ))}
                    </div>
                </div>
            );

            return (
                <div className="p-6 max-w-5xl mx-auto bg-white rounded-lg shadow-lg">
                    <div className="flex justify-between items-center mb-2">
                        <a href="index.html" className="text-blue-600 hover:text-blue-800">← Back to Home</a>
                    </div>

                    <h1 className="text-2xl font-bold text-center mb-1 text-gray-800">
                        SVD & Low-Rank Approximation
                    </h1>
                    <p className="text-center text-sm text-gray-500 mb-4">A = UΣVᵀ</p>

                    {/* Input Matrix */}
                    <div className="bg-gray-50 p-4 rounded-lg mb-6">
                        <h3 className="font-semibold text-gray-700 mb-3 text-center">Input Matrix A (editable)</h3>
                        <div className="flex justify-center">
                            <div className="inline-block border-l-2 border-r-2 border-gray-600 px-3 py-2">
                                {matrix.map((row, i) => (
                                    <div key={i} className="flex gap-2 mb-1">
                                        {row.map((val, j) => (
                                            <input
                                                key={j}
                                                type="number"
                                                value={val}
                                                onChange={(e) => updateMatrix(i, j, e.target.value)}
                                                className="w-16 text-center border rounded p-1 font-mono"
                                            />
                                        ))}
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>

                    {/* SVD Decomposition */}
                    <div className="bg-blue-50 p-4 rounded-lg mb-6">
                        <h3 className="font-semibold text-gray-700 mb-3 text-center">SVD: A = UΣVᵀ</h3>
                        <div className="flex flex-wrap justify-center items-center gap-4">
                            <MatrixDisplay data={U.map(row => row)} label="U" />
                            <span className="text-2xl">×</span>
                            <MatrixDisplay
                                data={[
                                    [S[0], 0, 0],
                                    [0, S[1], 0],
                                    [0, 0, S[2]]
                                ]}
                                label="Σ"
                            />
                            <span className="text-2xl">×</span>
                            <MatrixDisplay data={V.map((_, i) => V.map(row => row[i]))} label="Vᵀ" />
                        </div>
                    </div>

                    {/* Singular Values */}
                    <div className="bg-purple-50 p-4 rounded-lg mb-6">
                        <h3 className="font-semibold text-gray-700 mb-3">Singular Values</h3>
                        <div className="flex gap-6 justify-center flex-wrap">
                            {S.map((s, i) => (
                                <div key={i} className="text-center">
                                    <div className="text-2xl font-bold text-purple-600">σ{i + 1} = {s.toFixed(3)}</div>
                                    <div className="h-2 bg-gray-200 rounded mt-2 w-24">
                                        <div
                                            className="h-2 bg-purple-500 rounded"
                                            style={{ width: `${(s / Math.max(...S)) * 100}%` }}
                                        />
                                    </div>
                                    <div className="text-xs text-gray-500 mt-1">
                                        {((s * s) / S.reduce((sum, x) => sum + x * x, 0) * 100).toFixed(1)}% energy
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* Rank Selector */}
                    <div className="bg-yellow-50 p-4 rounded-lg mb-6">
                        <h3 className="font-semibold text-gray-700 mb-3">Low-Rank Approximation</h3>
                        <div className="flex items-center gap-4 justify-center mb-4">
                            <span className="text-gray-600">Keep rank:</span>
                            {[1, 2, 3].map(r => (
                                <button
                                    key={r}
                                    onClick={() => setRank(r)}
                                    className={`px-4 py-2 rounded-lg font-bold transition ${
                                        rank === r
                                            ? 'bg-yellow-500 text-white'
                                            : 'bg-gray-200 text-gray-700 hover:bg-gray-300'
                                    }`}
                                >
                                    r = {r}
                                </button>
                            ))}
                        </div>

                        <div className="flex flex-wrap justify-center items-center gap-6">
                            <MatrixDisplay data={matrix} label="Original A" />
                            <span className="text-2xl">≈</span>
                            <MatrixDisplay data={approx} label={`Rank-${rank} Approx`} highlight={true} />
                        </div>

                        <div className="mt-4 flex justify-center gap-8">
                            <div className="text-center">
                                <div className="text-sm text-gray-600">Frobenius Error</div>
                                <div className="text-xl font-bold text-red-600">‖A - A_r‖_F = {error.toFixed(4)}</div>
                            </div>
                            <div className="text-center">
                                <div className="text-sm text-gray-600">Energy Captured</div>
                                <div className="text-xl font-bold text-green-600">{energyCapture.toFixed(1)}%</div>
                            </div>
                        </div>

                        {/* Energy bar */}
                        <div className="mt-4 max-w-md mx-auto">
                            <div className="h-4 bg-gray-200 rounded-full overflow-hidden">
                                <div
                                    className="h-4 bg-green-500 transition-all duration-300"
                                    style={{ width: `${energyCapture}%` }}
                                />
                            </div>
                        </div>
                    </div>

                    {/* Formulas */}
                    <div className="bg-gray-50 p-4 rounded-lg">
                        <h3 className="font-semibold text-gray-700 mb-2">📐 Key Formulas</h3>
                        <ul className="text-sm text-gray-600 space-y-1">
                            <li>• <strong>Best rank-r approximation:</strong> A_r = Σᵢ₌₁ʳ σᵢ uᵢ vᵢᵀ</li>
                            <li>• <strong>Approximation error:</strong> ‖A - A_r‖_F = √(σ²ᵣ₊₁ + ... + σ²ₙ)</li>
                            <li>• <strong>Energy captured:</strong> (σ₁² + ... + σᵣ²) / (σ₁² + ... + σₙ²)</li>
                            <li>• <strong>Eckart-Young theorem:</strong> SVD gives optimal low-rank approximation</li>
                        </ul>
                    </div>

                    <p className="text-center text-xs text-gray-400 mt-6">
                        IME 775 - Chapter 4: Linear Algebraic Tools in Machine Learning
                    </p>
                </div>
            );
        }

        ReactDOM.render(<SVDVisualization />, document.getElementById('root'));
    </script>
</body>
</html>
