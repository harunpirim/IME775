<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positive Definiteness Tester - IME 775</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen py-8">
    <div id="root"></div>

    <script type="text/babel">
        function PositiveDefiniteVisualization() {
            const [a11, setA11] = React.useState(3);
            const [a12, setA12] = React.useState(1);
            const [a22, setA22] = React.useState(2);

            const compute = () => {
                const trace = a11 + a22;
                const det = a11 * a22 - a12 * a12;
                const disc = Math.sqrt(Math.max(0, trace*trace/4 - det));
                const lambda1 = trace/2 + disc;
                const lambda2 = trace/2 - disc;

                const getEigenvector = (lambda) => {
                    if (Math.abs(a12) > 0.0001) {
                        const v = [a12, lambda - a11];
                        const norm = Math.sqrt(v[0]*v[0] + v[1]*v[1]);
                        return [v[0]/norm, v[1]/norm];
                    }
                    return lambda === a11 ? [1, 0] : [0, 1];
                };

                const v1 = getEigenvector(lambda1);
                const v2 = getEigenvector(lambda2);

                let cls;
                if (lambda1 > 0.0001 && lambda2 > 0.0001) cls = 'Positive Definite';
                else if (lambda1 >= -0.0001 && lambda2 >= -0.0001) cls = 'Positive Semidefinite';
                else if (lambda1 < -0.0001 && lambda2 < -0.0001) cls = 'Negative Definite';
                else if (lambda1 <= 0.0001 && lambda2 <= 0.0001) cls = 'Negative Semidefinite';
                else cls = 'Indefinite';

                const kappa = Math.min(lambda1, lambda2) !== 0
                    ? Math.abs(Math.max(lambda1, lambda2) / Math.min(lambda1, lambda2))
                    : Infinity;

                return { eigenvalues: [lambda1, lambda2], eigenvectors: [v1, v2], classification: cls, conditionNumber: kappa };
            };

            const { eigenvalues, eigenvectors, classification, conditionNumber } = compute();

            const width = 400, height = 400;
            const center = width / 2;
            const scale = 60;
            const toX = (x) => center + x * scale;
            const toY = (y) => center - y * scale;

            // Level curves
            const levelCurves = [];
            [0.5, 1, 2, 3].forEach(c => {
                const points = [];
                for (let t = 0; t <= 2*Math.PI; t += 0.02) {
                    const cos = Math.cos(t), sin = Math.sin(t);
                    const q = a11*cos*cos + 2*a12*cos*sin + a22*sin*sin;
                    if (q > 0.001) {
                        const r = Math.sqrt(c / q);
                        points.push([toX(r*cos), toY(r*sin)]);
                    }
                }
                if (points.length > 10) levelCurves.push({ c, points });
            });

            const getColor = () => {
                if (classification.includes('Positive')) return { bg: 'bg-green-100', text: 'text-green-700', border: 'border-green-500', stroke: '#22c55e' };
                if (classification.includes('Negative')) return { bg: 'bg-red-100', text: 'text-red-700', border: 'border-red-500', stroke: '#ef4444' };
                return { bg: 'bg-yellow-100', text: 'text-yellow-700', border: 'border-yellow-500', stroke: '#eab308' };
            };
            const colors = getColor();

            return (
                <div className="p-6 max-w-5xl mx-auto bg-white rounded-lg shadow-lg">
                    <div className="mb-2">
                        <a href="../../index.html" className="text-blue-600 hover:text-blue-800">← Back to Home</a>
                    </div>

                    <h1 className="text-2xl font-bold text-center mb-1">Positive Definiteness Tester</h1>
                    <p className="text-center text-sm text-gray-500 mb-4">Classify symmetric matrices by their eigenvalues</p>

                    <div className="grid lg:grid-cols-2 gap-6">
                        <div>
                            <div className="bg-gray-50 p-4 rounded-lg mb-4">
                                <h3 className="font-semibold text-gray-700 mb-3 text-center">Symmetric Matrix A</h3>
                                <div className="flex justify-center">
                                    <div className="inline-block border-l-2 border-r-2 border-gray-600 px-3 py-2">
                                        <div className="flex gap-2 mb-1">
                                            <input type="number" value={a11} step="0.5"
                                                onChange={(e) => setA11(parseFloat(e.target.value) || 0)}
                                                className="w-16 text-center border rounded p-1 font-mono bg-blue-50" />
                                            <input type="number" value={a12} step="0.5"
                                                onChange={(e) => setA12(parseFloat(e.target.value) || 0)}
                                                className="w-16 text-center border rounded p-1 font-mono bg-purple-50" />
                                        </div>
                                        <div className="flex gap-2">
                                            <input type="number" value={a12} disabled
                                                className="w-16 text-center border rounded p-1 font-mono bg-purple-50 opacity-60" />
                                            <input type="number" value={a22} step="0.5"
                                                onChange={(e) => setA22(parseFloat(e.target.value) || 0)}
                                                className="w-16 text-center border rounded p-1 font-mono bg-green-50" />
                                        </div>
                                    </div>
                                </div>
                                <p className="text-xs text-gray-500 text-center mt-2">(Matrix kept symmetric: a21 = a12)</p>
                            </div>

                            <svg width={width} height={height} className="border border-gray-300 bg-white rounded mx-auto block">
                                {[-3,-2,-1,0,1,2,3].map(i => (
                                    <React.Fragment key={i}>
                                        <line x1={toX(i)} y1={0} x2={toX(i)} y2={height} stroke="#f0f0f0" />
                                        <line x1={0} y1={toY(i)} x2={width} y2={toY(i)} stroke="#f0f0f0" />
                                    </React.Fragment>
                                ))}
                                <line x1={0} y1={center} x2={width} y2={center} stroke="#999" />
                                <line x1={center} y1={0} x2={center} y2={height} stroke="#999" />
                                <text x={width-20} y={center-10} fill="#666" fontSize="14">x1</text>
                                <text x={center+10} y={20} fill="#666" fontSize="14">x2</text>

                                {levelCurves.map(({ c, points }, idx) => {
                                    const path = "M " + points.map(p => p.join(",")).join(" L ") + " Z";
                                    return (
                                        <path key={idx} d={path}
                                            fill={idx === 1 ? colors.stroke + "33" : "none"}
                                            stroke={colors.stroke}
                                            strokeWidth={idx === 1 ? 3 : 1}
                                            opacity={0.5 + idx * 0.15} />
                                    );
                                })}

                                {eigenvectors.map((v, i) => {
                                    const len = 2.5;
                                    const col = eigenvalues[i] >= 0 ? '#22c55e' : '#ef4444';
                                    return (
                                        <React.Fragment key={i}>
                                            <line x1={toX(-v[0]*len)} y1={toY(-v[1]*len)}
                                                x2={toX(v[0]*len)} y2={toY(v[1]*len)}
                                                stroke={col} strokeWidth="3" strokeDasharray="8,4" />
                                            <circle cx={toX(v[0]*len)} cy={toY(v[1]*len)} r="6" fill={col} />
                                            <text x={toX(v[0]*len)+10} y={toY(v[1]*len)} fill={col} fontSize="12" fontWeight="bold">
                                                {"λ"}{i+1}={eigenvalues[i].toFixed(2)}
                                            </text>
                                        </React.Fragment>
                                    );
                                })}
                                <circle cx={center} cy={center} r="5" fill="#333" />
                            </svg>
                            <p className="text-center text-sm text-gray-500 mt-2">Level curves of Q(x) | Dashed = eigenvectors</p>
                        </div>

                        <div className="space-y-4">
                            <div className={`p-6 rounded-lg border-2 ${colors.bg} ${colors.border}`}>
                                <h3 className="font-semibold text-gray-700 mb-2 text-center">Classification</h3>
                                <div className={`text-3xl font-bold text-center ${colors.text}`}>{classification}</div>
                                <div className="mt-4 flex justify-center gap-4">
                                    <div className="text-center">
                                        <div className={`text-xl font-bold ${eigenvalues[0] >= 0 ? 'text-green-600' : 'text-red-600'}`}>
                                            {"λ1"} = {eigenvalues[0].toFixed(3)}
                                        </div>
                                        <div className="text-xs text-gray-500">{eigenvalues[0] >= 0 ? '>= 0 ✓' : '< 0 ✗'}</div>
                                    </div>
                                    <div className="text-center">
                                        <div className={`text-xl font-bold ${eigenvalues[1] >= 0 ? 'text-green-600' : 'text-red-600'}`}>
                                            {"λ2"} = {eigenvalues[1].toFixed(3)}
                                        </div>
                                        <div className="text-xs text-gray-500">{eigenvalues[1] >= 0 ? '>= 0 ✓' : '< 0 ✗'}</div>
                                    </div>
                                </div>
                            </div>

                            <div className="bg-blue-50 p-4 rounded-lg border border-blue-200">
                                <h3 className="font-semibold text-gray-700 mb-2">Quick Tests for 2x2</h3>
                                <table className="w-full text-sm">
                                    <tbody>
                                        <tr>
                                            <td className="py-1">trace(A) = a11 + a22</td>
                                            <td className={`font-bold ${a11+a22 > 0 ? 'text-green-600' : 'text-red-600'}`}>{(a11+a22).toFixed(2)}</td>
                                        </tr>
                                        <tr>
                                            <td className="py-1">det(A) = a11*a22 - a12^2</td>
                                            <td className={`font-bold ${a11*a22-a12*a12 > 0 ? 'text-green-600' : 'text-red-600'}`}>{(a11*a22-a12*a12).toFixed(2)}</td>
                                        </tr>
                                        <tr>
                                            <td className="py-1">a11 (top-left)</td>
                                            <td className={`font-bold ${a11 > 0 ? 'text-green-600' : 'text-red-600'}`}>{a11.toFixed(2)}</td>
                                        </tr>
                                    </tbody>
                                </table>
                                <p className="text-xs text-gray-500 mt-2">PD: a11 &gt; 0 AND det(A) &gt; 0</p>
                            </div>

                            <div className="bg-purple-50 p-4 rounded-lg border border-purple-200">
                                <h3 className="font-semibold text-gray-700 mb-2">Condition Number</h3>
                                <div className="text-2xl font-bold text-purple-600 text-center">
                                    {"κ"} = {conditionNumber === Infinity ? '∞' : conditionNumber.toFixed(2)}
                                </div>
                                <p className="text-xs text-gray-500 text-center mt-1">{"κ"} = |{"λmax"} / {"λmin"}|</p>
                            </div>

                            <div className="bg-gray-50 p-4 rounded-lg">
                                <h3 className="font-semibold text-gray-700 mb-2">Classification Rules</h3>
                                <ul className="text-sm text-gray-600 space-y-1">
                                    <li className={classification === 'Positive Definite' ? 'font-bold text-green-600' : ''}>• <strong>Positive Definite:</strong> All eigenvalues &gt; 0</li>
                                    <li className={classification === 'Positive Semidefinite' ? 'font-bold text-green-600' : ''}>• <strong>Positive Semidefinite:</strong> All eigenvalues &gt;= 0</li>
                                    <li className={classification === 'Negative Definite' ? 'font-bold text-red-600' : ''}>• <strong>Negative Definite:</strong> All eigenvalues &lt; 0</li>
                                    <li className={classification === 'Indefinite' ? 'font-bold text-yellow-600' : ''}>• <strong>Indefinite:</strong> Mixed signs</li>
                                </ul>
                            </div>

                            <div className="flex flex-wrap gap-2">
                                <button onClick={() => { setA11(3); setA12(1); setA22(2); }}
                                    className="px-3 py-1 bg-green-100 rounded text-sm hover:bg-green-200">PD Example</button>
                                <button onClick={() => { setA11(1); setA12(1); setA22(1); }}
                                    className="px-3 py-1 bg-green-50 rounded text-sm hover:bg-green-100">PSD Example</button>
                                <button onClick={() => { setA11(-2); setA12(0); setA22(-3); }}
                                    className="px-3 py-1 bg-red-100 rounded text-sm hover:bg-red-200">ND Example</button>
                                <button onClick={() => { setA11(1); setA12(2); setA22(1); }}
                                    className="px-3 py-1 bg-yellow-100 rounded text-sm hover:bg-yellow-200">Indefinite</button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<PositiveDefiniteVisualization />);
    </script>
</body>
</html>
