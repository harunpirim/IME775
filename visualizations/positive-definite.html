<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positive Definiteness Tester - IME 775</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen py-8">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;

        function PositiveDefiniteVisualization() {
            const [a11, setA11] = useState(3);
            const [a12, setA12] = useState(1);
            const [a22, setA22] = useState(2);

            // Matrix is symmetric: A = [[a11, a12], [a12, a22]]
            const { eigenvalues, eigenvectors, classification, conditionNumber, isSymmetric } = useMemo(() => {
                // 2x2 eigenvalue formula
                const trace = a11 + a22;
                const det = a11 * a22 - a12 * a12;
                const discriminant = Math.sqrt(Math.max(0, trace * trace / 4 - det));

                const lambda1 = trace / 2 + discriminant;
                const lambda2 = trace / 2 - discriminant;

                // Eigenvectors
                const getEigenvector = (lambda) => {
                    if (Math.abs(a12) > 0.0001) {
                        const v = [a12, lambda - a11];
                        const norm = Math.sqrt(v[0] * v[0] + v[1] * v[1]);
                        return [v[0] / norm, v[1] / norm];
                    } else {
                        return lambda === a11 ? [1, 0] : [0, 1];
                    }
                };

                const v1 = getEigenvector(lambda1);
                const v2 = getEigenvector(lambda2);

                // Classification
                let cls;
                if (lambda1 > 0.0001 && lambda2 > 0.0001) {
                    cls = 'Positive Definite';
                } else if (lambda1 >= -0.0001 && lambda2 >= -0.0001) {
                    cls = 'Positive Semidefinite';
                } else if (lambda1 < -0.0001 && lambda2 < -0.0001) {
                    cls = 'Negative Definite';
                } else if (lambda1 <= 0.0001 && lambda2 <= 0.0001) {
                    cls = 'Negative Semidefinite';
                } else {
                    cls = 'Indefinite';
                }

                const kappa = Math.min(lambda1, lambda2) !== 0
                    ? Math.abs(Math.max(lambda1, lambda2) / Math.min(lambda1, lambda2))
                    : Infinity;

                return {
                    eigenvalues: [lambda1, lambda2],
                    eigenvectors: [v1, v2],
                    classification: cls,
                    conditionNumber: kappa,
                    isSymmetric: true
                };
            }, [a11, a12, a22]);

            const width = 400;
            const height = 400;
            const center = width / 2;
            const scale = 60;

            const toSvgX = (x) => center + x * scale;
            const toSvgY = (y) => center - y * scale;

            // Generate quadratic form surface (level curves)
            const levelCurves = [];
            const levels = [0.5, 1, 2, 3];

            levels.forEach(c => {
                const points = [];
                for (let theta = 0; theta <= 2 * Math.PI; theta += 0.02) {
                    // Solve a11*x^2 + 2*a12*x*y + a22*y^2 = c along direction theta
                    const cos = Math.cos(theta);
                    const sin = Math.sin(theta);
                    const q = a11 * cos * cos + 2 * a12 * cos * sin + a22 * sin * sin;
                    if (q > 0.001) {
                        const r = Math.sqrt(c / q);
                        points.push({ x: r * cos, y: r * sin });
                    }
                }
                if (points.length > 10) {
                    levelCurves.push({ c, points });
                }
            });

            // Saddle points for indefinite matrices
            const showSaddle = classification === 'Indefinite';

            // Color based on classification
            const getClassColor = () => {
                switch (classification) {
                    case 'Positive Definite': return { bg: 'bg-green-100', text: 'text-green-700', border: 'border-green-500', fill: 'rgba(34, 197, 94, 0.2)' };
                    case 'Positive Semidefinite': return { bg: 'bg-green-50', text: 'text-green-600', border: 'border-green-400', fill: 'rgba(34, 197, 94, 0.1)' };
                    case 'Negative Definite': return { bg: 'bg-red-100', text: 'text-red-700', border: 'border-red-500', fill: 'rgba(239, 68, 68, 0.2)' };
                    case 'Negative Semidefinite': return { bg: 'bg-red-50', text: 'text-red-600', border: 'border-red-400', fill: 'rgba(239, 68, 68, 0.1)' };
                    case 'Indefinite': return { bg: 'bg-yellow-100', text: 'text-yellow-700', border: 'border-yellow-500', fill: 'rgba(234, 179, 8, 0.2)' };
                    default: return { bg: 'bg-gray-100', text: 'text-gray-700', border: 'border-gray-500', fill: 'rgba(156, 163, 175, 0.2)' };
                }
            };

            const colors = getClassColor();

            return (
                <div className="p-6 max-w-5xl mx-auto bg-white rounded-lg shadow-lg">
                    <div className="flex justify-between items-center mb-2">
                        <a href="index.html" className="text-blue-600 hover:text-blue-800">← Back to Home</a>
                    </div>

                    <h1 className="text-2xl font-bold text-center mb-1 text-gray-800">
                        Positive Definiteness Tester
                    </h1>
                    <p className="text-center text-sm text-gray-500 mb-4">Classify symmetric matrices by their eigenvalues</p>

                    <div className="grid lg:grid-cols-2 gap-6">
                        {/* Left: Input and Visualization */}
                        <div>
                            {/* Matrix Input */}
                            <div className="bg-gray-50 p-4 rounded-lg mb-4">
                                <h3 className="font-semibold text-gray-700 mb-3 text-center">Symmetric Matrix A</h3>
                                <div className="flex justify-center">
                                    <div className="inline-block border-l-2 border-r-2 border-gray-600 px-3 py-2">
                                        <div className="flex gap-2 mb-1">
                                            <input type="number" value={a11} step="0.5"
                                                onChange={(e) => setA11(parseFloat(e.target.value) || 0)}
                                                className="w-16 text-center border rounded p-1 font-mono bg-blue-50" />
                                            <input type="number" value={a12} step="0.5"
                                                onChange={(e) => setA12(parseFloat(e.target.value) || 0)}
                                                className="w-16 text-center border rounded p-1 font-mono bg-purple-50" />
                                        </div>
                                        <div className="flex gap-2">
                                            <input type="number" value={a12} step="0.5" disabled
                                                className="w-16 text-center border rounded p-1 font-mono bg-purple-50 opacity-60" />
                                            <input type="number" value={a22} step="0.5"
                                                onChange={(e) => setA22(parseFloat(e.target.value) || 0)}
                                                className="w-16 text-center border rounded p-1 font-mono bg-green-50" />
                                        </div>
                                    </div>
                                </div>
                                <p className="text-xs text-gray-500 text-center mt-2">
                                    (Matrix is kept symmetric: a₂₁ = a₁₂)
                                </p>
                            </div>

                            {/* Visualization */}
                            <svg width={width} height={height} className="border border-gray-300 bg-white rounded shadow-inner mx-auto block">
                                {/* Grid */}
                                {[-3, -2, -1, 0, 1, 2, 3].map(i => (
                                    <React.Fragment key={`grid-${i}`}>
                                        <line x1={toSvgX(i)} y1={0} x2={toSvgX(i)} y2={height} stroke="#f0f0f0" strokeWidth="1" />
                                        <line x1={0} y1={toSvgY(i)} x2={width} y2={toSvgY(i)} stroke="#f0f0f0" strokeWidth="1" />
                                    </React.Fragment>
                                ))}

                                {/* Axes */}
                                <line x1={0} y1={center} x2={width} y2={center} stroke="#999" strokeWidth="1" />
                                <line x1={center} y1={0} x2={center} y2={height} stroke="#999" strokeWidth="1" />
                                <text x={width - 20} y={center - 10} fill="#666" fontSize="14">x₁</text>
                                <text x={center + 10} y={20} fill="#666" fontSize="14">x₂</text>

                                {/* Level curves */}
                                {levelCurves.map(({ c, points }, idx) => {
                                    const path = `M ${toSvgX(points[0].x)} ${toSvgY(points[0].y)} ` +
                                        points.slice(1).map(p => `L ${toSvgX(p.x)} ${toSvgY(p.y)}`).join(' ') + ' Z';
                                    return (
                                        <path key={idx} d={path}
                                            fill={idx === 1 ? colors.fill : 'none'}
                                            stroke={classification.includes('Positive') ? '#22c55e' :
                                                classification.includes('Negative') ? '#ef4444' : '#eab308'}
                                            strokeWidth={idx === 1 ? 3 : 1}
                                            opacity={0.5 + idx * 0.15}
                                        />
                                    );
                                })}

                                {/* Eigenvectors */}
                                {eigenvectors.map((v, i) => {
                                    const len = 2.5;
                                    const color = eigenvalues[i] >= 0 ? '#22c55e' : '#ef4444';
                                    return (
                                        <React.Fragment key={i}>
                                            <line
                                                x1={toSvgX(-v[0] * len)} y1={toSvgY(-v[1] * len)}
                                                x2={toSvgX(v[0] * len)} y2={toSvgY(v[1] * len)}
                                                stroke={color} strokeWidth="3" strokeDasharray="8,4"
                                            />
                                            <circle cx={toSvgX(v[0] * len)} cy={toSvgY(v[1] * len)} r="6" fill={color} />
                                            <text x={toSvgX(v[0] * len) + 10} y={toSvgY(v[1] * len)}
                                                fill={color} fontSize="12" fontWeight="bold">
                                                λ{i + 1}={eigenvalues[i].toFixed(2)}
                                            </text>
                                        </React.Fragment>
                                    );
                                })}

                                {/* Origin */}
                                <circle cx={center} cy={center} r="5" fill="#333" />
                            </svg>

                            <p className="text-center text-sm text-gray-500 mt-2">
                                Level curves of Q(x) = xᵀAx | Dashed lines = eigenvectors
                            </p>
                        </div>

                        {/* Right: Results */}
                        <div className="space-y-4">
                            {/* Classification Result */}
                            <div className={`p-6 rounded-lg border-2 ${colors.bg} ${colors.border}`}>
                                <h3 className="font-semibold text-gray-700 mb-2 text-center">Classification</h3>
                                <div className={`text-3xl font-bold text-center ${colors.text}`}>
                                    {classification}
                                </div>

                                <div className="mt-4 flex justify-center gap-4">
                                    <div className="text-center">
                                        <div className={`text-xl font-bold ${eigenvalues[0] >= 0 ? 'text-green-600' : 'text-red-600'}`}>
                                            λ₁ = {eigenvalues[0].toFixed(3)}
                                        </div>
                                        <div className="text-xs text-gray-500">{eigenvalues[0] >= 0 ? '≥ 0 ✓' : '< 0 ✗'}</div>
                                    </div>
                                    <div className="text-center">
                                        <div className={`text-xl font-bold ${eigenvalues[1] >= 0 ? 'text-green-600' : 'text-red-600'}`}>
                                            λ₂ = {eigenvalues[1].toFixed(3)}
                                        </div>
                                        <div className="text-xs text-gray-500">{eigenvalues[1] >= 0 ? '≥ 0 ✓' : '< 0 ✗'}</div>
                                    </div>
                                </div>
                            </div>

                            {/* Quick Tests */}
                            <div className="bg-blue-50 p-4 rounded-lg border border-blue-200">
                                <h3 className="font-semibold text-gray-700 mb-2">Quick Tests for 2×2</h3>
                                <table className="w-full text-sm">
                                    <tbody>
                                        <tr>
                                            <td className="py-1">trace(A) = a₁₁ + a₂₂</td>
                                            <td className={`font-bold ${a11 + a22 > 0 ? 'text-green-600' : 'text-red-600'}`}>
                                                {(a11 + a22).toFixed(2)}
                                            </td>
                                        </tr>
                                        <tr>
                                            <td className="py-1">det(A) = a₁₁a₂₂ - a₁₂²</td>
                                            <td className={`font-bold ${a11 * a22 - a12 * a12 > 0 ? 'text-green-600' : 'text-red-600'}`}>
                                                {(a11 * a22 - a12 * a12).toFixed(2)}
                                            </td>
                                        </tr>
                                        <tr>
                                            <td className="py-1">a₁₁ (top-left)</td>
                                            <td className={`font-bold ${a11 > 0 ? 'text-green-600' : 'text-red-600'}`}>
                                                {a11.toFixed(2)}
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                                <p className="text-xs text-gray-500 mt-2">
                                    PD ⟺ a₁₁ > 0 AND det(A) > 0
                                </p>
                            </div>

                            {/* Condition Number */}
                            <div className="bg-purple-50 p-4 rounded-lg border border-purple-200">
                                <h3 className="font-semibold text-gray-700 mb-2">Condition Number</h3>
                                <div className="text-2xl font-bold text-purple-600 text-center">
                                    κ = {conditionNumber === Infinity ? '∞' : conditionNumber.toFixed(2)}
                                </div>
                                <p className="text-xs text-gray-500 text-center mt-1">
                                    κ = |λ_max / λ_min| — measures how "stretched" the ellipse is
                                </p>
                                {conditionNumber > 10 && conditionNumber !== Infinity && (
                                    <p className="text-xs text-yellow-600 text-center mt-1">
                                        ⚠️ High condition number — matrix is ill-conditioned
                                    </p>
                                )}
                            </div>

                            {/* Classification Rules */}
                            <div className="bg-gray-50 p-4 rounded-lg">
                                <h3 className="font-semibold text-gray-700 mb-2">📐 Classification Rules</h3>
                                <ul className="text-sm text-gray-600 space-y-1">
                                    <li className={classification === 'Positive Definite' ? 'font-bold text-green-600' : ''}>
                                        • <strong>Positive Definite:</strong> All λᵢ > 0
                                    </li>
                                    <li className={classification === 'Positive Semidefinite' ? 'font-bold text-green-600' : ''}>
                                        • <strong>Positive Semidefinite:</strong> All λᵢ ≥ 0, some = 0
                                    </li>
                                    <li className={classification === 'Negative Definite' ? 'font-bold text-red-600' : ''}>
                                        • <strong>Negative Definite:</strong> All λᵢ < 0
                                    </li>
                                    <li className={classification === 'Indefinite' ? 'font-bold text-yellow-600' : ''}>
                                        • <strong>Indefinite:</strong> Mixed signs (λᵢ > 0 and λⱼ < 0)
                                    </li>
                                </ul>
                            </div>

                            {/* Preset Examples */}
                            <div className="flex flex-wrap gap-2">
                                <button onClick={() => { setA11(3); setA12(1); setA22(2); }}
                                    className="px-3 py-1 bg-green-100 rounded text-sm hover:bg-green-200">PD Example</button>
                                <button onClick={() => { setA11(1); setA12(1); setA22(1); }}
                                    className="px-3 py-1 bg-green-50 rounded text-sm hover:bg-green-100">PSD Example</button>
                                <button onClick={() => { setA11(-2); setA12(0); setA22(-3); }}
                                    className="px-3 py-1 bg-red-100 rounded text-sm hover:bg-red-200">ND Example</button>
                                <button onClick={() => { setA11(1); setA12(2); setA22(1); }}
                                    className="px-3 py-1 bg-yellow-100 rounded text-sm hover:bg-yellow-200">Indefinite</button>
                            </div>
                        </div>
                    </div>

                    <p className="text-center text-xs text-gray-400 mt-6">
                        IME 775 - Chapter 4: Linear Algebraic Tools in Machine Learning
                    </p>
                </div>
            );
        }

        ReactDOM.render(<PositiveDefiniteVisualization />, document.getElementById('root'));
    </script>
</body>
</html>
