<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LSA & Document Similarity - IME 775</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen py-8">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;

        function LSAVisualization() {
            const [documents, setDocuments] = useState([
                "machine learning algorithms data",
                "deep neural network training",
                "machine learning neural network"
            ]);
            const [query, setQuery] = useState("learning algorithms");
            const [numConcepts, setNumConcepts] = useState(2);

            const updateDoc = (idx, text) => {
                const newDocs = [...documents];
                newDocs[idx] = text;
                setDocuments(newDocs);
            };

            const { vocabulary, tfMatrix, tfidfMatrix, cosineSim, lsaSim, queryResults } = useMemo(() => {
                // Tokenize
                const tokenize = (text) => text.toLowerCase().split(/\s+/).filter(w => w.length > 0);

                // Build vocabulary
                const vocab = new Set();
                documents.forEach(doc => tokenize(doc).forEach(w => vocab.add(w)));
                const vocabList = Array.from(vocab).sort();
                const vocabIndex = {};
                vocabList.forEach((w, i) => vocabIndex[w] = i);

                // Term frequency matrix
                const tf = documents.map(doc => {
                    const counts = new Array(vocabList.length).fill(0);
                    tokenize(doc).forEach(w => {
                        if (vocabIndex[w] !== undefined) counts[vocabIndex[w]]++;
                    });
                    return counts;
                });

                // IDF
                const N = documents.length;
                const df = vocabList.map((_, i) => tf.filter(row => row[i] > 0).length);
                const idf = df.map(d => d > 0 ? Math.log(N / d) : 0);

                // TF-IDF
                const tfidf = tf.map(row => row.map((t, i) => t * idf[i]));

                // Cosine similarity (original space)
                const dot = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);
                const norm = (a) => Math.sqrt(a.reduce((s, x) => s + x * x, 0));
                const cosSim = (a, b) => {
                    const n1 = norm(a), n2 = norm(b);
                    return n1 > 0 && n2 > 0 ? dot(a, b) / (n1 * n2) : 0;
                };

                const cosMatrix = documents.map((_, i) =>
                    documents.map((_, j) => cosSim(tfidf[i], tfidf[j]))
                );

                // Simple SVD approximation for LSA
                // Using power iteration on tfidf^T * tfidf
                const m = tfidf.length;
                const n = vocabList.length;

                // Compute tfidf^T * tfidf
                const AtA = Array(n).fill(0).map(() => Array(n).fill(0));
                for (let i = 0; i < n; i++) {
                    for (let j = 0; j < n; j++) {
                        for (let k = 0; k < m; k++) {
                            AtA[i][j] += tfidf[k][i] * tfidf[k][j];
                        }
                    }
                }

                // Power iteration to get top k eigenvectors
                const k = Math.min(numConcepts, Math.min(m, n));
                const V = [];
                let remaining = AtA.map(row => [...row]);

                for (let c = 0; c < k; c++) {
                    let v = new Array(n).fill(1);
                    for (let iter = 0; iter < 30; iter++) {
                        let newV = new Array(n).fill(0);
                        for (let i = 0; i < n; i++) {
                            for (let j = 0; j < n; j++) {
                                newV[i] += remaining[i][j] * v[j];
                            }
                        }
                        const vNorm = Math.sqrt(newV.reduce((s, x) => s + x * x, 0));
                        v = newV.map(x => x / (vNorm || 1));
                    }

                    // Eigenvalue
                    let Av = new Array(n).fill(0);
                    for (let i = 0; i < n; i++) {
                        for (let j = 0; j < n; j++) {
                            Av[i] += remaining[i][j] * v[j];
                        }
                    }
                    const lambda = v.reduce((s, x, i) => s + x * Av[i], 0);

                    V.push({ v, sigma: Math.sqrt(Math.max(0, lambda)) });

                    // Deflate
                    for (let i = 0; i < n; i++) {
                        for (let j = 0; j < n; j++) {
                            remaining[i][j] -= lambda * v[i] * v[j];
                        }
                    }
                }

                // Project documents onto concept space
                const docConcepts = tfidf.map(row => {
                    return V.map(({ v, sigma }) => {
                        const proj = row.reduce((s, x, i) => s + x * v[i], 0);
                        return sigma > 0.001 ? proj : 0;
                    });
                });

                // LSA similarity
                const lsaMatrix = documents.map((_, i) =>
                    documents.map((_, j) => cosSim(docConcepts[i], docConcepts[j]))
                );

                // Query processing
                const queryTokens = tokenize(query);
                const queryTf = new Array(vocabList.length).fill(0);
                queryTokens.forEach(w => {
                    if (vocabIndex[w] !== undefined) queryTf[vocabIndex[w]]++;
                });
                const queryTfidf = queryTf.map((t, i) => t * idf[i]);

                // Project query to concept space
                const queryConcept = V.map(({ v, sigma }) => {
                    const proj = queryTfidf.reduce((s, x, i) => s + x * v[i], 0);
                    return sigma > 0.001 ? proj : 0;
                });

                const queryScores = documents.map((_, i) => ({
                    doc: i,
                    tfidfScore: cosSim(queryTfidf, tfidf[i]),
                    lsaScore: cosSim(queryConcept, docConcepts[i])
                }));

                return {
                    vocabulary: vocabList,
                    tfMatrix: tf,
                    tfidfMatrix: tfidf,
                    cosineSim: cosMatrix,
                    lsaSim: lsaMatrix,
                    queryResults: queryScores
                };
            }, [documents, query, numConcepts]);

            const SimMatrix = ({ data, title, colorClass }) => (
                <div>
                    <h4 className="font-medium text-sm text-gray-700 mb-2">{title}</h4>
                    <div className="inline-block">
                        <div className="flex">
                            <div className="w-8"></div>
                            {documents.map((_, j) => (
                                <div key={j} className="w-16 text-center text-xs text-gray-500">D{j + 1}</div>
                            ))}
                        </div>
                        {data.map((row, i) => (
                            <div key={i} className="flex items-center">
                                <div className="w-8 text-xs text-gray-500">D{i + 1}</div>
                                {row.map((val, j) => (
                                    <div
                                        key={j}
                                        className={`w-16 h-10 flex items-center justify-center text-xs font-mono border ${
                                            i === j ? 'bg-gray-100' : colorClass
                                        }`}
                                        style={{
                                            opacity: i === j ? 1 : 0.3 + val * 0.7,
                                            fontWeight: val > 0.5 ? 'bold' : 'normal'
                                        }}
                                    >
                                        {val.toFixed(2)}
                                    </div>
                                ))}
                            </div>
                        ))}
                    </div>
                </div>
            );

            return (
                <div className="p-6 max-w-6xl mx-auto bg-white rounded-lg shadow-lg">
                    <div className="flex justify-between items-center mb-2">
                        <a href="index.html" className="text-blue-600 hover:text-blue-800">← Back to Home</a>
                    </div>

                    <h1 className="text-2xl font-bold text-center mb-1 text-gray-800">
                        Latent Semantic Analysis (LSA)
                    </h1>
                    <p className="text-center text-sm text-gray-500 mb-4">TF-IDF, Cosine Similarity & Document Retrieval</p>

                    <div className="grid lg:grid-cols-2 gap-6">
                        {/* Left: Documents and Query */}
                        <div className="space-y-4">
                            {/* Documents Input */}
                            <div className="bg-gray-50 p-4 rounded-lg">
                                <h3 className="font-semibold text-gray-700 mb-3">Documents (editable)</h3>
                                {documents.map((doc, i) => (
                                    <div key={i} className="mb-2">
                                        <label className="text-sm text-gray-500">D{i + 1}:</label>
                                        <input
                                            type="text"
                                            value={doc}
                                            onChange={(e) => updateDoc(i, e.target.value)}
                                            className="w-full border rounded p-2 text-sm font-mono"
                                        />
                                    </div>
                                ))}
                            </div>

                            {/* Query */}
                            <div className="bg-blue-50 p-4 rounded-lg border border-blue-200">
                                <h3 className="font-semibold text-gray-700 mb-2">Search Query</h3>
                                <input
                                    type="text"
                                    value={query}
                                    onChange={(e) => setQuery(e.target.value)}
                                    className="w-full border rounded p-2 font-mono"
                                    placeholder="Enter search query..."
                                />

                                <div className="mt-3">
                                    <h4 className="text-sm font-medium text-gray-600 mb-2">Search Results:</h4>
                                    <div className="space-y-2">
                                        {queryResults
                                            .sort((a, b) => b.lsaScore - a.lsaScore)
                                            .map(({ doc, tfidfScore, lsaScore }) => (
                                                <div key={doc} className="flex items-center gap-2 p-2 bg-white rounded">
                                                    <span className="font-bold text-blue-600">D{doc + 1}</span>
                                                    <div className="flex-1">
                                                        <div className="flex justify-between text-xs">
                                                            <span>TF-IDF: {tfidfScore.toFixed(3)}</span>
                                                            <span className="font-bold text-green-600">LSA: {lsaScore.toFixed(3)}</span>
                                                        </div>
                                                        <div className="h-2 bg-gray-200 rounded mt-1">
                                                            <div className="h-2 bg-green-500 rounded" style={{ width: `${lsaScore * 100}%` }} />
                                                        </div>
                                                    </div>
                                                </div>
                                            ))}
                                    </div>
                                </div>
                            </div>

                            {/* Concept Selector */}
                            <div className="bg-purple-50 p-4 rounded-lg border border-purple-200">
                                <h3 className="font-semibold text-gray-700 mb-2">LSA Dimensions</h3>
                                <div className="flex items-center gap-4">
                                    <span className="text-gray-600">Latent concepts (k):</span>
                                    {[1, 2, 3].map(k => (
                                        <button
                                            key={k}
                                            onClick={() => setNumConcepts(k)}
                                            className={`px-4 py-2 rounded font-bold transition ${
                                                numConcepts === k
                                                    ? 'bg-purple-500 text-white'
                                                    : 'bg-gray-200 hover:bg-gray-300'
                                            }`}
                                        >
                                            k = {k}
                                        </button>
                                    ))}
                                </div>
                                <p className="text-xs text-gray-500 mt-2">
                                    Lower k = more generalization, may find semantic similarity
                                </p>
                            </div>
                        </div>

                        {/* Right: Matrices and Results */}
                        <div className="space-y-4">
                            {/* Vocabulary */}
                            <div className="bg-gray-50 p-3 rounded-lg">
                                <h3 className="font-semibold text-gray-700 mb-2 text-sm">Vocabulary ({vocabulary.length} terms)</h3>
                                <div className="flex flex-wrap gap-1">
                                    {vocabulary.map((word, i) => (
                                        <span key={i} className="px-2 py-1 bg-gray-200 rounded text-xs font-mono">
                                            {word}
                                        </span>
                                    ))}
                                </div>
                            </div>

                            {/* Similarity Matrices */}
                            <div className="grid grid-cols-2 gap-4">
                                <SimMatrix data={cosineSim} title="TF-IDF Cosine Similarity" colorClass="bg-blue-100" />
                                <SimMatrix data={lsaSim} title={`LSA Similarity (k=${numConcepts})`} colorClass="bg-green-100" />
                            </div>

                            {/* TF-IDF Matrix Preview */}
                            <div className="bg-yellow-50 p-4 rounded-lg border border-yellow-200">
                                <h3 className="font-semibold text-gray-700 mb-2">TF-IDF Matrix</h3>
                                <div className="overflow-x-auto">
                                    <table className="text-xs font-mono">
                                        <thead>
                                            <tr>
                                                <th className="px-2"></th>
                                                {vocabulary.slice(0, 6).map((w, i) => (
                                                    <th key={i} className="px-2 text-gray-500">{w.slice(0, 6)}</th>
                                                ))}
                                                {vocabulary.length > 6 && <th className="px-2 text-gray-400">...</th>}
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {tfidfMatrix.map((row, i) => (
                                                <tr key={i}>
                                                    <td className="px-2 text-gray-500">D{i + 1}</td>
                                                    {row.slice(0, 6).map((val, j) => (
                                                        <td key={j} className={`px-2 text-center ${val > 0 ? 'text-blue-600 font-bold' : 'text-gray-300'}`}>
                                                            {val.toFixed(2)}
                                                        </td>
                                                    ))}
                                                    {row.length > 6 && <td className="px-2 text-gray-400">...</td>}
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>

                            {/* Key Insight */}
                            <div className="bg-green-50 p-4 rounded-lg border border-green-200">
                                <h3 className="font-semibold text-gray-700 mb-2">💡 LSA Insight</h3>
                                <p className="text-sm text-gray-700">
                                    LSA uses SVD to find latent "concepts" that connect related terms.
                                    Documents can be similar in the concept space even without sharing exact words!
                                    Try reducing k to see how semantic relationships emerge.
                                </p>
                            </div>
                        </div>
                    </div>

                    <p className="text-center text-xs text-gray-400 mt-6">
                        IME 775 - Chapter 4: Linear Algebraic Tools in Machine Learning
                    </p>
                </div>
            );
        }

        ReactDOM.render(<LSAVisualization />, document.getElementById('root'));
    </script>
</body>
</html>
