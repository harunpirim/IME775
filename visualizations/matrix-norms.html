<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Norms Comparison - IME 775</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen py-8">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;

        function MatrixNormsVisualization() {
            const [matrix, setMatrix] = useState([
                [3, 0],
                [4, 0]
            ]);

            const updateMatrix = (i, j, val) => {
                const newMatrix = matrix.map(row => [...row]);
                newMatrix[i][j] = parseFloat(val) || 0;
                setMatrix(newMatrix);
            };

            const { frobeniusNorm, spectralNorm, singularValues, maxStretchVector, stretchedVector } = useMemo(() => {
                const A = matrix;
                const m = 2, n = 2;

                // Frobenius norm: sqrt(sum of squares)
                let frobSum = 0;
                for (let i = 0; i < m; i++) {
                    for (let j = 0; j < n; j++) {
                        frobSum += A[i][j] * A[i][j];
                    }
                }
                const frob = Math.sqrt(frobSum);

                // Compute A^T A
                const AtA = [
                    [A[0][0] * A[0][0] + A[1][0] * A[1][0], A[0][0] * A[0][1] + A[1][0] * A[1][1]],
                    [A[0][1] * A[0][0] + A[1][1] * A[1][0], A[0][1] * A[0][1] + A[1][1] * A[1][1]]
                ];

                // Eigenvalues of AtA (2x2 formula)
                const trace = AtA[0][0] + AtA[1][1];
                const det = AtA[0][0] * AtA[1][1] - AtA[0][1] * AtA[1][0];
                const discriminant = Math.sqrt(Math.max(0, trace * trace / 4 - det));
                const lambda1 = trace / 2 + discriminant;
                const lambda2 = Math.max(0, trace / 2 - discriminant);

                const sigma1 = Math.sqrt(Math.max(0, lambda1));
                const sigma2 = Math.sqrt(Math.max(0, lambda2));

                // Eigenvector for largest eigenvalue (right singular vector)
                let v1 = [1, 0];
                if (Math.abs(AtA[0][1]) > 0.0001 || Math.abs(AtA[1][0]) > 0.0001) {
                    const offDiag = AtA[0][1];
                    const diff = lambda1 - AtA[1][1];
                    v1 = [diff, offDiag];
                    const norm = Math.sqrt(v1[0] * v1[0] + v1[1] * v1[1]);
                    v1 = [v1[0] / norm, v1[1] / norm];
                } else if (AtA[0][0] >= AtA[1][1]) {
                    v1 = [1, 0];
                } else {
                    v1 = [0, 1];
                }

                // Apply A to v1
                const Av1 = [
                    A[0][0] * v1[0] + A[0][1] * v1[1],
                    A[1][0] * v1[0] + A[1][1] * v1[1]
                ];

                return {
                    frobeniusNorm: frob,
                    spectralNorm: sigma1,
                    singularValues: [sigma1, sigma2],
                    maxStretchVector: v1,
                    stretchedVector: Av1
                };
            }, [matrix]);

            const width = 350;
            const height = 350;
            const center = width / 2;
            const scale = 40;

            const toSvgX = (x) => center + x * scale;
            const toSvgY = (y) => center - y * scale;

            // Generate unit circle points
            const circlePoints = [];
            for (let theta = 0; theta <= 2 * Math.PI; theta += 0.05) {
                circlePoints.push({
                    x: Math.cos(theta),
                    y: Math.sin(theta)
                });
            }

            // Apply matrix to circle (becomes ellipse)
            const ellipsePoints = circlePoints.map(p => ({
                x: matrix[0][0] * p.x + matrix[0][1] * p.y,
                y: matrix[1][0] * p.x + matrix[1][1] * p.y
            }));

            const circlePath = `M ${toSvgX(circlePoints[0].x)} ${toSvgY(circlePoints[0].y)} ` +
                circlePoints.slice(1).map(p => `L ${toSvgX(p.x)} ${toSvgY(p.y)}`).join(' ') + ' Z';

            const ellipsePath = `M ${toSvgX(ellipsePoints[0].x)} ${toSvgY(ellipsePoints[0].y)} ` +
                ellipsePoints.slice(1).map(p => `L ${toSvgX(p.x)} ${toSvgY(p.y)}`).join(' ') + ' Z';

            return (
                <div className="p-6 max-w-5xl mx-auto bg-white rounded-lg shadow-lg">
                    <div className="flex justify-between items-center mb-2">
                        <a href="index.html" className="text-blue-600 hover:text-blue-800">← Back to Home</a>
                    </div>

                    <h1 className="text-2xl font-bold text-center mb-1 text-gray-800">
                        Matrix Norms Comparison
                    </h1>
                    <p className="text-center text-sm text-gray-500 mb-4">Spectral Norm vs Frobenius Norm</p>

                    <div className="grid lg:grid-cols-2 gap-6">
                        {/* Left: Input and Visualization */}
                        <div>
                            {/* Input Matrix */}
                            <div className="bg-gray-50 p-4 rounded-lg mb-4">
                                <h3 className="font-semibold text-gray-700 mb-3 text-center">Matrix A (editable)</h3>
                                <div className="flex justify-center">
                                    <div className="inline-block border-l-2 border-r-2 border-gray-600 px-3 py-2">
                                        {matrix.map((row, i) => (
                                            <div key={i} className="flex gap-2 mb-1">
                                                {row.map((val, j) => (
                                                    <input
                                                        key={j}
                                                        type="number"
                                                        value={val}
                                                        onChange={(e) => updateMatrix(i, j, e.target.value)}
                                                        className="w-16 text-center border rounded p-1 font-mono"
                                                    />
                                                ))}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>

                            {/* Visualization */}
                            <svg width={width} height={height} className="border border-gray-300 bg-white rounded shadow-inner mx-auto block">
                                {/* Grid */}
                                {[-4, -3, -2, -1, 0, 1, 2, 3, 4].map(i => (
                                    <React.Fragment key={`grid-${i}`}>
                                        <line x1={toSvgX(i)} y1={0} x2={toSvgX(i)} y2={height} stroke="#f0f0f0" strokeWidth="1" />
                                        <line x1={0} y1={toSvgY(i)} x2={width} y2={toSvgY(i)} stroke="#f0f0f0" strokeWidth="1" />
                                    </React.Fragment>
                                ))}

                                {/* Axes */}
                                <line x1={0} y1={center} x2={width} y2={center} stroke="#999" strokeWidth="1" />
                                <line x1={center} y1={0} x2={center} y2={height} stroke="#999" strokeWidth="1" />

                                {/* Unit circle (input) */}
                                <path d={circlePath} fill="rgba(59, 130, 246, 0.1)" stroke="#3b82f6" strokeWidth="2" strokeDasharray="5,5" />

                                {/* Transformed ellipse (output) */}
                                <path d={ellipsePath} fill="rgba(220, 38, 38, 0.2)" stroke="#dc2626" strokeWidth="3" />

                                {/* Max stretch vector */}
                                <line
                                    x1={center} y1={center}
                                    x2={toSvgX(maxStretchVector[0])} y2={toSvgY(maxStretchVector[1])}
                                    stroke="#3b82f6" strokeWidth="2"
                                />
                                <circle cx={toSvgX(maxStretchVector[0])} cy={toSvgY(maxStretchVector[1])} r="5" fill="#3b82f6" />

                                {/* Stretched vector */}
                                <line
                                    x1={center} y1={center}
                                    x2={toSvgX(stretchedVector[0])} y2={toSvgY(stretchedVector[1])}
                                    stroke="#dc2626" strokeWidth="3"
                                />
                                <circle cx={toSvgX(stretchedVector[0])} cy={toSvgY(stretchedVector[1])} r="6" fill="#dc2626" />

                                {/* Labels */}
                                <text x={toSvgX(1.2)} y={toSvgY(0.8)} fill="#3b82f6" fontSize="12" fontWeight="bold">Unit circle</text>
                                <text x={toSvgX(stretchedVector[0] * 0.7)} y={toSvgY(stretchedVector[1] * 0.7) - 10} fill="#dc2626" fontSize="12" fontWeight="bold">
                                    |Ax| = σ₁ = {spectralNorm.toFixed(2)}
                                </text>
                            </svg>

                            <p className="text-center text-sm text-gray-500 mt-2">
                                Blue: unit circle | Red: image under A
                            </p>
                        </div>

                        {/* Right: Results */}
                        <div className="space-y-4">
                            {/* Norm Comparison */}
                            <div className="bg-gradient-to-r from-blue-50 to-red-50 p-4 rounded-lg border">
                                <h3 className="font-semibold text-gray-700 mb-4 text-center">Norm Comparison</h3>

                                <div className="space-y-4">
                                    {/* Spectral Norm */}
                                    <div className="bg-white p-3 rounded-lg shadow">
                                        <div className="flex justify-between items-center">
                                            <span className="font-medium text-red-600">Spectral Norm ‖A‖₂</span>
                                            <span className="text-2xl font-bold text-red-600">{spectralNorm.toFixed(4)}</span>
                                        </div>
                                        <div className="text-sm text-gray-500 mt-1">= σ_max = max stretch factor</div>
                                        <div className="h-3 bg-gray-200 rounded mt-2">
                                            <div className="h-3 bg-red-500 rounded" style={{ width: `${Math.min(100, spectralNorm / Math.max(spectralNorm, frobeniusNorm) * 100)}%` }} />
                                        </div>
                                    </div>

                                    {/* Frobenius Norm */}
                                    <div className="bg-white p-3 rounded-lg shadow">
                                        <div className="flex justify-between items-center">
                                            <span className="font-medium text-purple-600">Frobenius Norm ‖A‖_F</span>
                                            <span className="text-2xl font-bold text-purple-600">{frobeniusNorm.toFixed(4)}</span>
                                        </div>
                                        <div className="text-sm text-gray-500 mt-1">= √(Σᵢⱼ aᵢⱼ²) = √(σ₁² + σ₂²)</div>
                                        <div className="h-3 bg-gray-200 rounded mt-2">
                                            <div className="h-3 bg-purple-500 rounded" style={{ width: `${Math.min(100, frobeniusNorm / Math.max(spectralNorm, frobeniusNorm) * 100)}%` }} />
                                        </div>
                                    </div>
                                </div>

                                {/* Inequality */}
                                <div className="mt-4 text-center p-3 bg-yellow-50 rounded-lg">
                                    <span className="font-mono text-lg">
                                        ‖A‖₂ ≤ ‖A‖_F
                                    </span>
                                    <br />
                                    <span className="text-sm text-gray-600">
                                        {spectralNorm.toFixed(3)} ≤ {frobeniusNorm.toFixed(3)} ✓
                                    </span>
                                </div>
                            </div>

                            {/* Singular Values */}
                            <div className="bg-purple-50 p-4 rounded-lg border border-purple-200">
                                <h3 className="font-semibold text-gray-700 mb-2">Singular Values</h3>
                                <div className="flex gap-4 justify-center">
                                    <div className="text-center">
                                        <div className="text-xl font-bold text-purple-600">σ₁ = {singularValues[0].toFixed(3)}</div>
                                        <div className="text-xs text-gray-500">largest</div>
                                    </div>
                                    <div className="text-center">
                                        <div className="text-xl font-bold text-purple-400">σ₂ = {singularValues[1].toFixed(3)}</div>
                                        <div className="text-xs text-gray-500">smallest</div>
                                    </div>
                                </div>
                                <div className="mt-2 text-center text-sm text-gray-600">
                                    ‖A‖_F = √({singularValues[0].toFixed(2)}² + {singularValues[1].toFixed(2)}²) = {frobeniusNorm.toFixed(3)}
                                </div>
                            </div>

                            {/* Formulas */}
                            <div className="bg-gray-50 p-4 rounded-lg">
                                <h3 className="font-semibold text-gray-700 mb-2">📐 Definitions</h3>
                                <ul className="text-sm text-gray-600 space-y-2">
                                    <li><strong>Spectral norm:</strong> ‖A‖₂ = max_{‖x‖=1} ‖Ax‖ = σ_max</li>
                                    <li><strong>Frobenius norm:</strong> ‖A‖_F = √(Σᵢⱼ aᵢⱼ²) = √(Σᵢ σᵢ²)</li>
                                    <li><strong>Relationship:</strong> ‖A‖₂ ≤ ‖A‖_F ≤ √r · ‖A‖₂</li>
                                </ul>
                            </div>

                            {/* Insight */}
                            <div className="bg-green-50 p-4 rounded-lg border border-green-200">
                                <h3 className="font-semibold text-gray-700 mb-2">💡 Insight</h3>
                                <p className="text-sm text-gray-700">
                                    {singularValues[1] < 0.01
                                        ? "This matrix is nearly rank-1! One singular value dominates, so ‖A‖₂ ≈ ‖A‖_F."
                                        : singularValues[0] / singularValues[1] > 5
                                            ? `Large condition number (κ = ${(singularValues[0]/singularValues[1]).toFixed(1)}). Matrix is ill-conditioned.`
                                            : "Both singular values are significant. Matrix is well-conditioned."
                                    }
                                </p>
                            </div>
                        </div>
                    </div>

                    <p className="text-center text-xs text-gray-400 mt-6">
                        IME 775 - Chapter 4: Linear Algebraic Tools in Machine Learning
                    </p>
                </div>
            );
        }

        ReactDOM.render(<MatrixNormsVisualization />, document.getElementById('root'));
    </script>
</body>
</html>
